- id: restorative-yoga-nidra
  title: Restorative & Yoga Nidra
  instructor_id: bruna
  duration_min: 60
  short_description: "Slow supported postures & guided deep rest for the nervous system."
  description: "Restorative & Yoga Nidra classes are a slower pace practice, inviting the students to stay in an asana (Yoga posture) for 2 to 3 minutes, slowing their breath rhythm and using props to aid relaxation, stretch and restauration of tissues. Yoga Nidra is a guided meditation practice in which the mind state is in between wakefulness and sleep, inducing the activation of the parasympathetic nervous system, responsible for rest and digest functions and regulation of hormones that promote the sense of safety and availability for connection."
  url: "https://calendar.app.google/da2Sbrmkg9JGJiwq9"

