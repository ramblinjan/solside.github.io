- id: hatha-yoga
  title: Hatha Yoga
  instructor_id: bruna
  duration_min: 60
  short_description: "Alignment, breath & meditation through the 8 limbs of Patanjali."
  description: "Hatha Yoga classes contain all aspects of the Yoga discipline following the 8 limbs of Patanjali. Expect slightly more rigorous classes (movement wise) that focus on alignment, breath and meditation."
  url: "https://calendar.app.google/txXgcFHvhPW4PPME8"

- id: heart-of-yoga
  title: Heart of Yoga
  instructor_id: bruna
  duration_min: 60
  short_description: "Breath-led, accessible movement — meet yourself exactly as you are."
  description: "Heart of Yoga classes are an invitation to being with exactly how we are in the moment. Movements are breath-led and the sequence is just a guide, accessible to all body types and ages. Another intention for this practice is allowing students to create their own practice and a new type of intimacy with themselves."
  url: "https://calendar.app.google/P3DnDWagN9mRW8d28"

- id: restorative-yoga-nidra
  title: Restorative & Yoga Nidra
  instructor_id: bruna
  duration_min: 60
  short_description: "Slow supported postures & guided deep rest for the nervous system."
  description: "Restorative & Yoga Nidra classes are a slower pace practice, inviting the students to stay in an asana (Yoga posture) for 2 to 3 minutes, slowing their breath rhythm and using props to aid relaxation, stretch and restauration of tissues. Yoga Nidra is a guided meditation practice in which the mind state is in between wakefulness and sleep, inducing the activation of the parasympathetic nervous system, responsible for rest and digest functions and regulation of hormones that promote the sense of safety and availability for connection."
  url: "https://calendar.app.google/da2Sbrmkg9JGJiwq9"

