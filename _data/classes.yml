- id: kung-fu-beginners-mind
  title: "Kung Fu: The Beginner's Mind"
  instructor_id: jan-kung-fu
  duration_min: 60
  short_description: "Soft-style internal kung fu — ancient teachings meet modern neuroscience."
  description: "Internal, Soft-Style Kung Fu for all skill levels. By incorporating ancient teachings with modern lessons in neuroscience, in this limited series we will explore what it means to be a beginner. We will build a foundation of Kung Fu conditioning -- both physical and mental -- and learn how to protect the most precious gift we have: a beginner's perspective."
